" height="25" rx="3" fill="#17324b" stroke="none" stroke-width="3"/><path d="M20 14H74M34 25H77" fill="none" stroke="#17324b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="19" cy="38" r="10" fill="white" stroke="#17324b" stroke-width="3"/><path d="M68 38Q108 40 100 112" fill="none" stroke="#17324b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><rect x="10" y="88" width="58" height="45" rx="2" fill="white" stroke="none" stroke-width="3"/></g><text x="178" y="481" font-family="Arial,sans-serif" font-size="32" fill="#17324b" font-weight="700" text-anchor="start">CO2</text><text x="178" y="523" font-family="Arial,sans-serif" font-size="25" fill="#087b61" font-weight="700" text-anchor="start">Sesuai rating produk</text><text x="178" y="567" font-family="Arial,sans-serif" font-size="22" fill="#506579" font-weight="400" text-anchor="start">Kenali corong pelepas.</text><text x="178" y="601" font-family="Arial,sans-serif" font-size="22" fill="#506579" font-weight="400" text-anchor="start">Perhatikan ruang pemakaian.</text><rect x="612" y="433" width="536" height="212" rx="16" fill="white" stroke="none" stroke-width="3"/><g transform="translate(638 457) scale(0.7)"><rect x="0" y="38" width="78" height="140" rx="16" fill="#c93636" stroke="none" stroke-width="3"/><rect x="24" y="18" width="30" height="25" rx="3" fill="#17324b" stroke="none" stroke-width="3"/><path d="M20 14H74M34 25H77" fill="none" stroke="#17324b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="19" cy="38" r="10" fill="white" stroke="#17324b" stroke-width="3"/><path d="M68 38Q108 40 100 112" fill="none" stroke="#17324b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><rect x="10" y="88" width="58" height="45" rx="2" fill="white" stroke="none" stroke-width="3"/></g><text x="738" y="481" font-family="Arial,sans-serif" font-size="32" fill="#17324b" font-weight="700" text-anchor="start">Media khusus</text><text x="738" y="523" font-family="Arial,sans-serif" font-size="25" fill="#087b61" font-weight="700" text-anchor="start">Risiko khusus</text><text x="738" y="567" font-family="Arial,sans-serif" font-size="22" fill="#506579" font-weight="400" text-anchor="start">Minyak masak atau logam:</text><text x="738" y="601" font-family="Arial,sans-serif" font-size="22" fill="#506579" font-weight="400" text-anchor="start">pilih produk yang sesuai.</text><text x="600" y="710" font-family="Arial,sans-serif" font-size="27" fill="#17324b" font-weight="700" text-anchor="middle">Pilih dari media dan rating pada label — bukan warna tabung.</text><path d="M52 737H1148" fill="none" stroke="#ccd7e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="52" y="775" font-family="Arial,sans-serif" font-size="18" fill="#506579" font-weight="400" text-anchor="start">Ilustrasi edukatif • Wahana Totalita • Baca penjelasan dan sumber pada artikel</text></svg>