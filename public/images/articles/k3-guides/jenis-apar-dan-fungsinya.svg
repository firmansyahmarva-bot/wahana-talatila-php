<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Jenis APAR: mulai dari label</title><desc id="desc">Cocokkan bahan yang terbakar, rating alat, dan kondisi area.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f3f7fa" stroke="none" stroke-width="3"/><text x="52" y="53" font-family="Arial,sans-serif" font-size="20" fill="#087b61" font-weight="700" text-anchor="start">PANDUAN K3</text><text x="52" y="111" font-family="Arial,sans-serif" font-size="42" fill="#17324b" font-weight="700" text-anchor="start">Jenis APAR: mulai dari label</text><text x="52" y="155" font-family="Arial,sans-serif" font-size="23" fill="#506579" font-weight="400" text-anchor="start">Cocokkan bahan yang terbakar, rating alat, dan kondisi area.</text><rect x="52" y="198" width="536" height="212" rx="16" fill="white" stroke="none" stroke-width="3"/><g transform="translate(78 222) scale(0.7)"><rect x="0" y="38" width="78" height="140" rx="16" fill="#c93636" stroke="none" stroke-width="3"/><rect x="24" y="18" width="30" height="25" rx="3" fill="#17324b" stroke="none" stroke-width="3"/><path d="M20 14H74M34 25H77" fill="none" stroke="#17324b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="19" cy="38" r="10" fill="white" stroke="#17324b" stroke-width="3"/><path d="M68 38Q108 40 100 112" fill="none" stroke="#17324b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><rect x="10" y="88" width="58" height="45" rx="2" fill="white" stroke="none" stroke-width="3"/></g><text x="178" y="246" font-family="Arial,sans-serif" font-size="32" fill="#17324b" font-weight="700" text-anchor="start">Air / water</text><text x="178" y="288" font-family="Arial,sans-serif" font-size=