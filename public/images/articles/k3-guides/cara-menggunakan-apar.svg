ns-serif" font-size="23" fill="#506579" font-weight="400" text-anchor="start">Pegang bagian</text><text x="79" y="599" font-family="Arial,sans-serif" font-size="23" fill="#506579" font-weight="400" text-anchor="start">yang dirancang aman.</text><path d="M424 532h97m-97-36 97 24" fill="none" stroke="#17324b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M497 458L497 503" fill="none" stroke="#c93636" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="612" y="424" width="536" height="212" rx="16" fill="white" stroke="none" stroke-width="3"/><circle cx="654" cy="464" r="23" fill="#087b61" stroke="none" stroke-width="4"/><text x="654" y="472" font-family="Arial,sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">4</text><text x="694" y="472" font-family="Arial,sans-serif" font-size="30" fill="#17324b" font-weight="700" text-anchor="start">SWEEP</text><text x="639" y="519" font-family="Arial,sans-serif" font-size="29" fill="#17324b" font-weight="700" text-anchor="start">Sapukan</text><text x="639" y="564" font-family="Arial,sans-serif" font-size="23" fill="#506579" font-weight="400" text-anchor="start">Pada area pangkal;</text><text x="639" y="599" font-family="Arial,sans-serif" font-size="23" fill="#506579" font-weight="400" text-anchor="start">jaga jalan keluar.</text><path d="M977 554q54-68 108 0" fill="none" stroke="#c93636" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="600" y="702" font-family="Arial,sans-serif" font-size="24" fill="#c93636" font-weight="700" text-anchor="middle">Sebelum PASS: alarm • alat sesuai • terlatih • jalur keluar aman</text><path d="M52 737H1148" fill="none" stroke="#ccd7e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="52" y="775" font-family="Arial,sans-serif" font-size="18" fill="#506579" font-weight="400" text-anchor="start">Il