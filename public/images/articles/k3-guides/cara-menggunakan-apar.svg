<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">PASS: urutan memakai APAR</title><desc id="desc">Pengingat operasi; bukan pengganti latihan dan petunjuk alat.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f3f7fa" stroke="none" stroke-width="3"/><text x="52" y="53" font-family="Arial,sans-serif" font-size="20" fill="#087b61" font-weight="700" text-anchor="start">PANDUAN K3</text><text x="52" y="111" font-family="Arial,sans-serif" font-size="42" fill="#17324b" font-weight="700" text-anchor="start">PASS: urutan memakai APAR</text><text x="52" y="155" font-family="Arial,sans-serif" font-size="23" fill="#506579" font-weight="400" text-anchor="start">Pengingat operasi; bukan pengganti latihan dan petunjuk alat.</text><rect x="52" y="193" width="536" height="212" rx="16" fill="white" stroke="none" stroke-width="3"/><circle cx="94" cy="233" r="23" fill="#087b61" stroke="none" stroke-width="4"/><text x="94" y="241" font-family="Arial,sans-serif" font-size="23" fill="white" font-weight="700" text-anchor="middle">1</text><text x="134" y="241" font-family="Arial,sans-serif" font-size="30" fill="#17324b" font-weight="700" text-anchor="start">PULL</text><text x="79" y="288" font-family="Arial,sans-serif" font-size="29" fill="#17324b" font-weight="700" text-anchor="start">Tarik pin</text><text x="79" y="333" font-family="Arial,sans-serif" font-size="23" fill="#506579" font-weight="400" text-anchor="start">Kenali pengaman</text><text x="79" y="368" font-family="Arial,sans-serif" font-size="23" fill="#506579" font-weight="400" text-anchor="start">pada model alat.</text><path d="M460 269h52m-52 0v35" fill="none" stroke="#17324b" stroke-width="7" stroke-linecap="round" stroke-linejoin