<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Tindakan atau kondisi tidak aman?</title><desc id="desc">Keduanya bisa terkait. Kategori bukan penetapan siapa yang bersalah.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f3f7fa" stroke="none" stroke-width="3"/><text x="52" y="53" font-family="Arial,sans-serif" font-size="20" fill="#087b61" font-weight="700" text-anchor="start">PANDUAN K3</text><text x="52" y="111" font-family="Arial,sans-serif" font-size="42" fill="#17324b" font-weight="700" text-anchor="start">Tindakan atau kondisi tidak aman?</text><text x="52" y="155" font-family="Arial,sans-serif" font-size="23" fill="#506579" font-weight="400" text-anchor="start">Keduanya bisa terkait. Kategori bukan penetapan siapa yang bersalah.</text><rect x="52" y="205" width="536" height="435" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="320" y="257" font-family="Arial,sans-serif" font-size="31" fill="#17324b" font-weight="700" text-anchor="middle">TINDAKAN</text><path d="M97 528H542" fill="none" stroke="#506579" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M232 386v142m95-142v142M232 399h95" fill="none" stroke="#c93636" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><circle cx="289" cy="342" r="18" fill="#1764a5" stroke="none" stroke-width="4"/><path d="M289 364v60m0-38-30 28m30-28 28 25m-28 13-25 48m25-48 28 48" fill="none" stroke="#1764a5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><path d="M362 397L462 397" fill="none" stroke="#c93636" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="80" y="585" font-family="Arial,sans-serif" font-size="24" fill="#506579" font-weight="400" text-anchor="start">Melangkahi pembatas area.</text><text x="80" y="621" font-family="Arial,sans-serif" font-size="24" fill="#506579" font-weight="400" text-anchor="start">Amati tindakan, cari konteks.</text><rect x="612" y="205" width="536" height="435" rx="16" fill="white" stroke="none" stroke-width="3"/><text x="880" y="257" font-family="Arial,sans-serif" font-size="31" fill="#17324b" font-weight="700" text-anchor="middle">KONDISI</text><path d="M657 528H1102" fill="none" stroke="#506579" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="790" y="428" width="116" height="99" rx="3" fill="#ffd64a" stroke="#17324b" stroke-width="3"/><rect x="918" y="465" width="92" height="62" rx="3" fill="#ffd64a" stroke="#17324b" stroke-width="3"/><path d="M722 339v189m325-189v189" fill="none" stroke="#087b61" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><text x="640" y="585" font-family="Arial,sans-serif" font-size="24" fill="#506579" font-weight="400" text-anchor="start">Kotak menutup jalur.</text><text x="640" y="621" font-family="Arial,sans-serif" font-size="24" fill="#506579" font-weight="400" text-anchor="start">Amati keadaan dan paparannya.</text><text x="600" y="691" font-family="Arial,sans-serif" font-size="27" fill="#087b61" font-weight="700" text-anchor="middle">Perbaikan: fakta → penyebab → kontrol → verifikasi</text><path d="M52 737H1148" fill="none" stroke="#ccd7e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="52" y="775" font-family="Arial,sans-serif" font-size="18" fill="#506579" font-weight="400" text-anchor="start">Ilustrasi edukatif • Wahana Totalita • Baca penjelasan dan sumber pada artikel</text></svg>