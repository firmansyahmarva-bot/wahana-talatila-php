<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Voltase listrik: pahami angka nominalnya</title><desc id="desc">Ilustrasi perhitungan minus 10 persen dan plus 5 persen: dari 220 volt menjadi 198 hingga 231 volt; dari 230 volt menjadi 207 hingga 241,5 volt. Bukan jaminan keamanan semua alat.</desc><rect width="1200" height="630" fill="#f5f8fb"/><g font-family="Arial,sans-serif" fill="#142b40"><text x="70" y="78" font-size="20" font-weight="700" fill="#176c61">PANDUAN SPANING LISTRIK</text><text x="70" y="140" font-size="43" font-weight="700">Voltase normal: nominalnya penting</text><text x="70" y="187" font-size="23">Ilustrasi batas hitung −10% dan +5% dari nominal fase–netral</text><rect x="70" y="229" width="1060" height="125" rx="12" fill="white"/><text x="100" y="278" font-size="24" font-weight="700">Nominal 220 V</text><text x="100" y="316" font-size="19">Acuan yang sering dikutip</text><text x="480" y="285" font-size="34" font-weight="700">198 V</text><path d="M640 275h210m-18-10 18 10-18 10" fill="none" stroke="#176c61" stroke-width="4"/><text x="910" y="285" font-size="34" font-weight="700">231 V</text><text x="480" y="320" font-size="19">220 × 0,90</text><text x="910" y="320" font-size="19">220 × 1,05</text><rect x="70" y="372" width="1060" height="125" rx="12" fill="white"/><text x="100" y="421" font-size="24" font-weight="700">Nominal 230 V</text><text x="100" y="459" font-size="19">Konteks JTR 230/400 V</text><text x="480" y="428" font-size="34" font-weight="700">207 V</text><path d="M640 418h210m-18-10 18 10-18 10" fill="none" stroke="#176c61" stroke-width="4"/><text x="910" y="428" font-size="34" font-weight="700">241,5 V</text><text x="480" y="463" font-size="19">230 × 0,90</text><text x="910" y="463" font-size="19">230 × 1,05</text><text x="70" y="544" font-size="21">Cocokkan nominal pelayanan dan spesifikasi alat.</text><text x="70" y="577" font-size="19">Rentang hitung bukan jaminan semua alat aman. Rujukan: ESDM • wahanatotalita.com</text></g></svg>