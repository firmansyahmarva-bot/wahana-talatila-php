name: Daily Scheduled Rebuild & Deploy

on:
  schedule:
    # 01:00 WIB (Asia/Jakarta, UTC+7) is 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Astro build
        run: npm run build

      - name: Verification checks
        run: |
          npm run check
          npm run lint:design

      - name: Trigger Cloudflare Pages deploy hook
        run: |
          curl -X POST "${{ secrets.CF_PAGES_DEPLOY_HOOK }}"
