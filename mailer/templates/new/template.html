<!doctype html>
<html lang="id" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>PT Wahana Totalita Konsultan</title>
<!--[if mso]>
<style type="text/css">
table { border-collapse: collapse; }
</style>
<![endif]-->
<style type="text/css">
@media only screen and (max-width:600px) {
  .wtm-container { width: 100% !important; }
  .wtm-px { padding-left: 24px !important; padding-right: 24px !important; }
  .wtm-band { padding-top: 32px !important; padding-bottom: 32px !important; }
}
</style>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f6f5" style="background-color:#f4f6f5;">
<tr>
<td align="center" style="padding:40px 16px;">
<table role="presentation" class="wtm-container" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px;max-width:560px;background-color:#ffffff;border-radius:6px;overflow:hidden;">

<!-- Header band -->
<tr>
<td class="wtm-px wtm-band" bgcolor="#0A4A2E" align="left" style="background-color:#0A4A2E;padding:40px 40px 36px 40px;">
<img src="{{site_logo_url}}" width="120" height="32" alt="PT Wahana Totalita Konsultan" style="display:block;border:0;outline:none;height:auto;max-width:120px;margin:0 0 22px 0;">
<p style="margin:0 0 8px 0;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:12px;line-height:1.4;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#C6621C;">{{eyebrow}}</p>
<p style="margin:0;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:26px;line-height:1.3;font-weight:700;color:#ffffff;">{{headline}}</p>
</td>
</tr>

<!-- Body -->
<tr>
<td class="wtm-px" style="padding:36px 40px 0 40px;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:16px;line-height:1.7;color:#1a1a1a;">
<p style="margin:0 0 20px 0;">Yth. {{contact_name}},</p>
{{message}}
</td>
</tr>

<!-- CTA -->
<tr>
<td class="wtm-px" align="left" style="padding:30px 40px 0 40px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
<tr>
<td align="center" bgcolor="#0A4A2E" style="background-color:#0A4A2E;border-radius:4px;">
<!--[if mso]>
<v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{cta_url}}" style="height:46px;v-text-anchor:middle;width:220px;" arcsize="9%" strokecolor="#0A4A2E" fillcolor="#0A4A2E">
<w:anchorlock/>
<center style="color:#ffffff;font-family:Arial,sans-serif;font-size:15px;font-weight:bold;">{{cta_text}}</center>
</v:roundrect>
<![endif]-->
<!--[if !mso]><!-- -->
<a href="{{cta_url}}" target="_blank" style="display:inline-block;padding:14px 34px;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;">{{cta_text}}</a>
<!--<![endif]-->
</td>
</tr>
</table>
</td>
</tr>

<!-- Footer -->
<tr>
<td class="wtm-px" style="padding:44px 40px 36px 40px;border-top:1px solid #e2e5e3;margin-top:40px;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:12px;line-height:1.8;color:#999999;">
<p style="margin:18px 0 4px 0;">PT Wahana Totalita Konsultan &middot; <a href="{{site_url}}" style="color:#999999;">{{site_url}}</a></p>
<p style="margin:0;">&copy; {{current_year}} &middot; <a href="{{unsubscribe_url}}" style="color:#999999;">Berhenti berlangganan</a></p>
</td>
</tr>

</table>
</td>
</tr>
</table>
</body>
</html>
