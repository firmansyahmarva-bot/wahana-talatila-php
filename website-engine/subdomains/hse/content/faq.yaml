- question: Apa itu HSE Wahana
  answer: HSE Wahana adalah hub konten yang membahas karier, jenjang sertifikasi, dan dasar keselamatan kerja (K3) di Indonesia, dikelola sebagai perluasan topik K3 dari Wahana Totalita Konsultan.
- question: Apakah HSE Wahana menyediakan lowongan kerja
  answer: Tidak. Halaman ini berisi panduan dan pengetahuan seputar karier serta keselamatan kerja, bukan daftar lowongan kerja aktif.
- question: Apa saja posisi HSE yang umum ada di perusahaan
  answer: Posisi umum meliputi HSE Officer, HSE Supervisor, HSE Coordinator, hingga HSE Manager, dengan cakupan tanggung jawab yang meningkat sesuai jenjangnya.
- question: Sertifikasi apa yang biasanya dibutuhkan untuk naik jenjang di bidang HSE
  answer: Umumnya dimulai dari sertifikasi Ahli K3 Umum (AK3U), lalu dilengkapi sertifikasi berbasis kompetensi BNSP atau sertifikasi spesialis sesuai sektor industri tempat bekerja.
- question: Apa perbedaan identifikasi bahaya dan penilaian risiko
  answer: Identifikasi bahaya adalah proses menemukan sumber potensi bahaya di tempat kerja, sedangkan penilaian risiko adalah proses menilai seberapa besar kemungkinan dan dampak bahaya tersebut agar dapat dikendalikan.
- question: Apa dasar hukum utama K3 di Indonesia
  answer: Dasar hukum utama K3 di Indonesia adalah Undang-Undang Nomor 1 Tahun 1970 tentang Keselamatan Kerja, yang kemudian dilengkapi berbagai peraturan turunan dari Kementerian Ketenagakerjaan.
