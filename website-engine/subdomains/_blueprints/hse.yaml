niche_analysis:
  audience: "Pencari kerja dan profesional yang ingin masuk atau berkembang di bidang HSE/K3 di Indonesia, dari fresh graduate hingga calon HSE manager, serta staf yang butuh referensi dasar keselamatan kerja."
  business_model: "Hub konten edukasi seputar karier dan pengetahuan K3, bukan job board maupun toko jasa. Memperluas topical authority K3 milik Wahana Totalita Konsultan."
  value_proposition: "Satu rujukan terstruktur untuk memahami jalur karier HSE, jenjang sertifikasi, dan dasar keselamatan kerja di Indonesia, ditulis mengikuti kerangka regulasi K3 yang berlaku."
  competitive_notes: "Kompetitor pada niche K3 Indonesia umumnya lembaga pelatihan yang menjual sertifikasi atau portal lowongan kerja generik. Celah topikal ada pada konten jenjang karier dan panduan keselamatan yang disusun lengkap sebagai satu arsitektur pillar/cluster, bukan artikel lepas."

