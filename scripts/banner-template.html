<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1822">
<title>Banner</title>
<style>
  /* Standalone render template — hex values intentional, no tokens.css access */
  @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1822px;
    height: 662px;
    overflow: hidden;
    font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
    background: #fff;
  }

  .banner {
    position: relative;
    width: 1822px;
    height: 662px;
    overflow: hidden;
    background: #fff;
  }

  /* ── PHOTO LAYER (right 55%) ── */
  .photo-layer {
    position: absolute;
    right: 0;
    top: 0;
    width: 65%;
    height: 100%;
    overflow: hidden;
  }
  .photo-layer img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center right;
    display: block;
  }
  /* gradient fade-in from left over the photo */
  .photo-layer::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, #fff 0%, rgba(255,255,255,0.85) 20%, rgba(239,246,255,0.5) 45%, rgba(239,246,255,0.1) 65%, transparent 100%);
    z-index: 1;
  }

  /* ── BASE TEXT ZONE (left 45%) ── */
  .text-zone {
    position: absolute;
    left: 0;
    top: 0;
    width: 51%;
    height: 100%;
    background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 40%, #eff6ff 70%, transparent 100%);
    padding: 36px 48px 36px 52px;
    display: flex;
    flex-direction: column;
    gap: 0;
    z-index: 2;
  }

  /* ── TOP PILL ── */
  .eyebrow-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #d97706;
    color: #fff;
    font-family: 'Lexend', 'Source Sans 3', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 7px 16px 7px 12px;
    border-radius: 999px;
    margin-bottom: 20px;
    width: fit-content;
  }
  .eyebrow-pill svg { flex-shrink: 0; }

  /* ── TITLE BLOCK ── */
  .title-block {
    margin-bottom: 14px;
  }
  .title-line1 {
    font-family: 'Lexend', 'Source Sans 3', sans-serif;
    font-size: 26px;
    font-weight: 500;
    color: #1b4332;
    line-height: 1.2;
    display: block;
  }
  .title-line2 {
    font-family: 'Lexend', 'Source Sans 3', sans-serif;
    font-size: 40px;
    font-weight: 800;
    color: #d97706;
    line-height: 1.15;
    display: block;
    word-break: break-word;
  }
  .title-line3 {
    font-family: 'Lexend', 'Source Sans 3', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: #1b4332;
    line-height: 1.3;
    display: block;
    margin-top: 4px;
  }

  /* ── SUB TEXT ── */
  .sub-text {
    font-size: 14.5px;
    color: #475569;
    line-height: 1.55;
    margin-bottom: 20px;
    max-width: 440px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ── FEATURES ── */
  .features {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .feature-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13.5px;
    font-weight: 600;
    color: #1b4332;
  }
  .feature-icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: #d97706;
  }

  /* ── PRICE BADGE (overlapping zone) ── */
  .price-badge {
    position: absolute;
    right: 35%;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    background: #1b4332;
    border-radius: 16px;
    padding: 20px 22px;
    min-width: 200px;
    max-width: 240px;
    box-shadow: 0 8px 32px rgba(27,67,50,0.35), 0 2px 8px rgba(0,0,0,0.2);
    border: 2px solid rgba(255,255,255,0.15);
  }
  .price-label {
    display: block;
    font-family: 'Lexend', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: #d97706;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .price-name {
    display: block;
    font-family: 'Lexend', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    line-height: 1.3;
    margin-bottom: 10px;
    word-break: break-word;
  }
  .price-value {
    display: block;
    font-family: 'Lexend', sans-serif;
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    line-height: 1.1;
  }
  .price-per {
    display: block;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-top: 4px;
    text-transform: uppercase;
  }
  .price-ribbon {
    margin-top: 12px;
    background: #d97706;
    color: #fff;
    font-family: 'Lexend', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 6px;
    text-align: center;
    display: block;
  }

  /* ── TOP-RIGHT CERT CARD ── */
  .cert-card {
    position: absolute;
    top: 24px;
    right: 24px;
    z-index: 10;
    background: #fff;
    border-radius: 12px;
    padding: 14px 18px;
    min-width: 170px;
    max-width: 210px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12), 0 1px 4px rgba(0,0,0,0.08);
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .cert-card-icon {
    color: #1b4332;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .cert-card-text { flex: 1; }
  .cert-card-label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    color: #64748B;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 3px;
  }
  .cert-card-issuer {
    display: block;
    font-family: 'Lexend', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #1b4332;
    line-height: 1.3;
  }
</style>
</head>
<body>
<div class="banner" id="banner">

  <!-- PHOTO LAYER -->
  <div class="photo-layer" id="photoLayer">
    <img id="photoImg" src="" alt="">
  </div>

  <!-- TEXT ZONE -->
  <div class="text-zone">
    <!-- Top pill -->
    <div class="eyebrow-pill">
      <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
        <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/>
        <path d="M9 12l2 2 4-4" stroke-width="2.5"/>
      </svg>
      PELATIHAN &amp; SERTIFIKASI
    </div>

    <!-- Title -->
    <div class="title-block">
      <span class="title-line1" id="line1">Pelatihan</span>
      <span class="title-line2" id="line2"></span>
      <span class="title-line3" id="line3"></span>
    </div>

    <!-- Sub -->
    <p class="sub-text" id="subText"></p>

    <!-- Features -->
    <div class="features">
      <div class="feature-item">
        <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        Instruktur Berpengalaman &amp; Praktisi Ahli
      </div>
      <div class="feature-item">
        <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
        <span id="certFeature">Sertifikat Resmi BNSP</span>
      </div>
      <div class="feature-item">
        <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2"/>
          <path d="M16 3h-2a2 2 0 00-2 2v2M10 3H8a2 2 0 00-2 2v2"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
        </svg>
        Fasilitas Lengkap &amp; Modern
      </div>
      <div class="feature-item" id="modeFeatureItem">
        <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
        <span id="modeFeature">Pilihan Kelas Online &amp; Offline</span>
      </div>
    </div>
  </div>

  <!-- PRICE BADGE -->
  <div class="price-badge">
    <span class="price-label">HARGA SPESIAL</span>
    <span class="price-name" id="priceName"></span>
    <span class="price-value" id="priceValue"></span>
    <span class="price-per">/ ORANG</span>
    <span class="price-ribbon" id="priceRibbon">Sertifikasi Resmi BNSP</span>
  </div>

  <!-- CERT CARD (top-right) -->
  <div class="cert-card">
    <span class="cert-card-icon">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
        <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/>
      </svg>
    </span>
    <span class="cert-card-text">
      <span class="cert-card-label">Sertifikasi Resmi</span>
      <span class="cert-card-issuer" id="certIssuer">Dikeluarkan oleh BNSP</span>
    </span>
  </div>
</div>

<script>
(function() {
  // Parse data from query param
  var params = new URLSearchParams(location.search);
  var raw = params.get('data');
  if (!raw) return;

  var d;
  try {
    d = JSON.parse(atob(raw));
  } catch(e) {
    console.error('parse error', e);
    return;
  }

  // Populate photo
  if (d.photoSrc) {
    document.getElementById('photoImg').src = d.photoSrc;
  }

  // Title lines
  document.getElementById('line1').textContent = d.line1 || 'Pelatihan';

  // Auto-shrink line2 font size
  var line2El = document.getElementById('line2');
  line2El.textContent = d.line2 || '';
  var l2 = d.line2 || '';
  var fontSize = l2.length <= 20 ? 40 : l2.length <= 28 ? 34 : l2.length <= 36 ? 28 : l2.length <= 44 ? 24 : 20;
  line2El.style.fontSize = fontSize + 'px';

  document.getElementById('line3').textContent = d.line3 || '';

  // Sub text
  document.getElementById('subText').textContent = d.sub || '';

  // Cert feature
  var certLabel = d.cert === 'Kemnaker RI' ? 'Sertifikat Resmi Kemnaker RI' : d.cert === 'BNSP' ? 'Sertifikat Resmi BNSP' : 'Sertifikat Resmi';
  document.getElementById('certFeature').textContent = certLabel;

  // Mode feature
  var mode = (d.mode || '').toLowerCase();
  var modeText = mode === 'online' ? 'Kelas Online via Zoom Meeting'
    : mode === 'offline' ? 'Kelas Tatap Muka Langsung'
    : 'Pilihan Kelas Online & Offline';
  document.getElementById('modeFeature').textContent = modeText;

  // Price badge
  document.getElementById('priceName').textContent = d.line2 || '';
  document.getElementById('priceValue').textContent = d.price || 'Hubungi Kami';

  var certShort = d.cert === 'Kemnaker RI' ? 'Kemnaker RI' : 'BNSP';
  document.getElementById('priceRibbon').textContent = 'Sertifikasi Resmi ' + certShort;

  // Cert card
  var issuerText = d.cert === 'Kemnaker RI' ? 'Dikeluarkan oleh Kemnaker RI' : d.cert === 'BNSP' ? 'Dikeluarkan oleh BNSP' : 'Dikeluarkan oleh ' + (d.cert || 'BNSP');
  document.getElementById('certIssuer').textContent = issuerText;
})();
</script>
</body>
</html>
